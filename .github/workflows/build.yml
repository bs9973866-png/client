name: Build NIGHTFALL

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.12
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Restore mod icon and download licensed custom font
        run: |
          mkdir -p src/main/resources/assets/nightfall/font
          base64 --decode icons/nightfall-icon-64.png.b64 > src/main/resources/assets/nightfall/icon.png
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/google/fonts/main/ofl/exo2/Exo2%5Bwght%5D.ttf" -o /tmp/exo2-variable.ttf
          python3 -m venv /tmp/fonttools-venv
          /tmp/fonttools-venv/bin/pip install --disable-pip-version-check fonttools
          /tmp/fonttools-venv/bin/python -m fontTools.varLib.instancer /tmp/exo2-variable.ttf wght=400 --output=src/main/resources/assets/nightfall/font/exo2.ttf

      - name: Build mod
        run: gradle build --no-daemon

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: nightfall-minecraft-1.21.4
          path: build/libs/nightfall-1.0.0.jar
          if-no-files-found: error
